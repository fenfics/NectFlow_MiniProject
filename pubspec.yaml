name: nectflowproject
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4


# -----------------------------
# ตั้งค่าโลโก้แอป
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

# ตั้งค่า Splash Screen
flutter_native_splash:
  image: "assets/logo/logo.png"
  background_image: "assets/splash_background.png"
  android: true

# -----------------------------
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/logo/
